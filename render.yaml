services:
  - type: web
    name: fabric-lead-finder
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      cd web && npm install && npm run build
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: NODE_VERSION
        value: "20"
      - key: AMAP_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
